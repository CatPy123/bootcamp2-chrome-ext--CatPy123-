name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Instalar dependências
        run: npm ci
        
      - name: Instalar Playwright Browsers (Chromium)
        # Necessário no ambiente do GitHub Actions
        run: npx playwright install --with-deps chromium
        
      - name: Build da extensão (dist/ + .zip)
        run: npm run build
        
      - name: Testes E2E com Playwright
        # O '|| true' garante que os passos de upload de artefatos sejam executados mesmo se os testes falharem
        run: npm run test:e2e || true 
        
      - name: Publicar Relatório do Playwright
        if: always() # Garante o upload do relatório, mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          
      - name: Publicar Pacote da Extensão (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/extension.zip

  lighthouse:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Instalar dependências
        run: npm ci
        
      - name: Instalar Lighthouse
        run: npm install --save-dev lighthouse
        
      - name: Build da extensão
        run: npm run build
        
      - name: Executar Lighthouse na página popup
        run: |
          npx lighthouse file://${{ github.workspace }}/src/popup/popup.html \
            --output=json \
            --output-path=./lighthouse-popup.json \
            --chrome-flags="--headless --no-sandbox" || true
            
      - name: Executar Lighthouse na página options
        run: |
          npx lighthouse file://${{ github.workspace }}/src/options/options.html \
            --output=json \
            --output-path=./lighthouse-options.json \
            --chrome-flags="--headless --no-sandbox" || true
            
      - name: Executar Lighthouse com HTML report
        run: |
          npx lighthouse file://${{ github.workspace }}/src/popup/popup.html \
            --output=html \
            --output-path=./lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox" || true
            
      - name: Publicar Relatório do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lighthouse-popup.json
            lighthouse-options.json
            lighthouse-report.html
            
      - name: Criar resumo do Lighthouse
        if: always()
        run: |
          node -e "
            const popup = require('./lighthouse-popup.json');
            const options = require('./lighthouse-options.json');
            
            const formatScore = (score) => {
              if (!score) return 'N/A';
              const numScore = Math.round(score * 100);
              if (numScore >= 90) return '🟢 ' + numScore;
              if (numScore >= 50) return '🟡 ' + numScore;
              return '🔴 ' + numScore;
            };
            
            console.log('## 📊 Lighthouse Results\n');
            console.log('### Popup Page');
            console.log(\`- Performance: \${formatScore(popup.categories.performance.score)}\`);
            console.log(\`- Accessibility: \${formatScore(popup.categories.accessibility.score)}\`);
            console.log(\`- Best Practices: \${formatScore(popup.categories['best-practices'].score)}\`);
            console.log(\`- SEO: \${formatScore(popup.categories.seo.score)}\`);
            console.log(\`- PWA: \${formatScore(popup.categories.pwa?.score)}\`);
            
            console.log('\n### Options Page');
            console.log(\`- Performance: \${formatScore(options.categories.performance.score)}\`);
            console.log(\`- Accessibility: \${formatScore(options.categories.accessibility.score)}\`);
            console.log(\`- Best Practices: \${formatScore(options.categories['best-practices'].score)}\`);
            console.log(\`- SEO: \${formatScore(options.categories.seo.score)}\`);
            console.log(\`- PWA: \${formatScore(options.categories.pwa?.score)}\`);
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true